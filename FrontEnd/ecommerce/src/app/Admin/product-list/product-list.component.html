<mat-card>
  <mat-card-title>Products</mat-card-title>

  <!-- Search + Filter Row -->
  <div class="toolbar">

    <mat-form-field>
      <mat-label>Search</mat-label>
      <input matInput (keyup)="applySearch($event)" placeholder="Name / Color">
    </mat-form-field>

    <mat-form-field>
      <mat-label>Category</mat-label>
      <mat-select (selectionChange)="filterByCategory($event.value)">
        <mat-option value="">All</mat-option>
        <mat-option *ngFor="let c of categories" [value]="c">
          {{c}}
        </mat-option>
      </mat-select>
    </mat-form-field>

  </div>

  <!-- Table -->
  <table mat-table [dataSource]="filteredProducts" class="mat-elevation-z2">
   
    <!-- Serial Number -->
    <ng-container matColumnDef="Id">
      <th mat-header-cell *matHeaderCellDef> Id </th>
      <td mat-cell *matCellDef="let p; let i = index" > {{p.id}} </td>
    </ng-container>

    <!-- Name -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let p"> {{p.name}} </td>
    </ng-container>

    <!-- Price -->
    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef> Price </th>
      <td mat-cell *matCellDef="let p"> ₹{{p.price}} </td>
    </ng-container>

    <!-- Stock -->
    <ng-container matColumnDef="stock">
      <th mat-header-cell *matHeaderCellDef> Stock </th>
      <td mat-cell *matCellDef="let p"> {{p.stock}} </td>
    </ng-container>

    <!-- Category -->
    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef> Category </th>
      <td mat-cell *matCellDef="let p"> {{p.categoryName}} </td>
    </ng-container>

    <!-- Actions -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let p">

        <button mat-icon-button color="primary" (click)="edit(p.id)">
          <mat-icon>edit</mat-icon>
        </button>

        <button mat-icon-button color="warn" (click)="delete(p.id)">
          <mat-icon>delete</mat-icon>
        </button>

      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns;"></tr>

  </table>
</mat-card>
