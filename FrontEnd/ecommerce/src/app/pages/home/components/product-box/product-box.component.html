
  <mat-card *ngIf="product" [ngClass]="{'text-center': !fullWidthMode}"> <!-- Centraliza se não for no modo 1 coluna -->
    <div [ngClass]="{flex: fullWidthMode}">
      <a [routerLink]="['item-detail', product.id]">
      <img [ngClass]="{'h-200px' : !fullWidthMode, 'h-[360px]': fullWidthMode}"
      [src]="product.imageUrl" alt="" class="mb-1 mx-auto h-[200px]">
        </a>
      <div class="w-full" [ngClass]="{'px-8 flex flex-col justify-between': fullWidthMode}">
        <div>
          
          <p class="truncate hover:whitespace-normal">{{ product.name }}</p>
          <p *ngIf="fullWidthMode">{{ product.description }}</p>
        </div>

        <div class="flex justify-between">
          <span class="text-red-400">{{ product.price | currency }}</span>
          <button (click)="onAddToCart()">
            <mat-icon class="text-gray-500">shopping_cart</mat-icon>
          </button>          
        </div>

      </div>
    </div>
  </mat-card>
