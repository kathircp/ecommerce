<mat-card *ngFor="let order of orders" class="order-card">

  <h3>Order #{{ order.id }}</h3>
  <p>Date: {{ order.orderDate | date }}</p>
  <p>Total: ₹{{ order.totalAmount }}</p>
  <p>Status: <strong>{{ order.status }}</strong></p>

  <button
    mat-raised-button
    color="primary"
    [routerLink]="['/orders', order.id]">
    Track Order
  </button>

</mat-card>
